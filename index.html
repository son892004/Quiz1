<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Từ Vựng 2A - Bài 1 (S & W)</title>
<style>
body {
  margin: 0;
  padding: 18px;
  background: #f5f3ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #111;
}
.card {
  max-width: 650px;
  margin: auto;
  background: white;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}
h1 {
  text-align: center;
  font-size: 24px;
  margin-top: 0;
  color: #312e81;
}
.sub {
  text-align: center;
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 12px;
}
.meta {
  display: flex;
  justify-content: space-between;
  margin: 16px 0;
  color: #4b5563;
  font-weight: 600;
}
.q {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  margin: 24px 0;
  color: #1e1b4b;
  word-break: break-word;
}
.answers {
  display: grid;
  gap: 12px;
}
.answer {
  padding: 16px;
  border: 2px solid #e5e7eb;
  border-radius: 14px;
  background: #f9fafb;
  text-align: left;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  color: #1f2937;
}
.answer:hover:not(:disabled) {
  background: #eef2ff;
  border-color: #6366f1;
}
.answer.correct {
  background: #dcfce7;
  border-color: #22c55e;
  color: #15803d;
}
.answer.wrong {
  background: #fee2e2;
  border-color: #ef4444;
  color: #b91c1c;
}
.next, .restart {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #4f46e5;
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 12px;
  transition: background 0.2s;
}
.next:hover, .restart:hover {
  background: #4338ca;
}
.hidden { display: none; }
.feedback {
  text-align: center;
  min-height: 25px;
  margin: 14px 0;
  font-weight: 700;
  font-size: 16px;
}
.settings {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.settings select {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  background: #fff;
  font-size: 14px;
  color: #374151;
  font-weight: 500;
}
.progress {
  height: 8px;
  background: #e5e7eb;
  border-radius: 8px;
  overflow: hidden;
}
.bar {
  height: 100%;
  background: #4f46e5;
  width: 0%;
  transition: width 0.3s ease;
}
.result { text-align: center; }
.big {
  font-size: 52px;
  font-weight: 900;
  color: #4f46e5;
  margin: 16px 0;
}
</style>
</head>
<body>
<div class="card">
  <div id="quiz">
    <h1>🇰🇷 Quiz Từ Vựng 2A — Bài 1</h1>
    <div class="sub">Tổng hợp 56 từ vựng từ S【1과】 & W【1과】</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta">
      <span id="counter">Câu 1/10</span>
      <span id="score">Điểm: 0</span>
    </div>
    <div id="question" class="q"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback"></div>
    <button id="next" class="next hidden">Câu tiếp theo →</button>
    <div class="settings">
      <select id="mode">
        <option value="ko">🇰🇷 Hàn → Việt</option>
        <option value="vi">🇻🇳 Việt → Hàn</option>
      </select>
      <select id="amount">
        <option value="10">10 câu</option>
        <option value="20">20 câu</option>
        <option value="30">30 câu</option>
        <option value="56">Toàn bộ (56 câu)</option>
      </select>
    </div>
  </div>
  <div id="result" class="result hidden">
    <h1>🎉 Hoàn thành!</h1>
    <div id="final" class="big"></div>
    <p id="message"></p>
    <button id="restart" class="restart">🔄 Làm lại bài Quiz</button>
  </div>
</div>

<script>
var WORDS = [
  // S【1과】 (45 từ)
  {"ko": "성명", "vi": "Tên họ / Họ tên"},
  {"ko": "성별", "vi": "Giới tính"},
  {"ko": "생년월일", "vi": "Ngày tháng năm sinh"},
  {"ko": "직업", "vi": "Công việc / Nghề nghiệp"},
  {"ko": "국적", "vi": "Quốc tịch"},
  {"ko": "종교", "vi": "Tôn giáo"},
  {"ko": "연락처", "vi": "Thông tin liên hệ"},
  {"ko": "주소", "vi": "Địa chỉ"},
  {"ko": "전화", "vi": "Số điện thoại"},
  {"ko": "이메일", "vi": "Email"},
  {"ko": "매일", "vi": "Mỗi ngày"},
  {"ko": "매주", "vi": "Mỗi tuần"},
  {"ko": "매달", "vi": "Mỗi tháng"},
  {"ko": "매년", "vi": "Mỗi năm"},
  {"ko": "항상", "vi": "Luôn luôn"},
  {"ko": "자주", "vi": "Thường xuyên"},
  {"ko": "가끔", "vi": "Thỉnh thoảng"},
  {"ko": "(이름을) 부르다", "vi": "Gọi là (tên)"},
  {"ko": "뵙다", "vi": "Gặp (kính ngữ)"},
  {"ko": "그냥", "vi": "Chỉ là / Tự nhiên / Cứ"},
  {"ko": "(학교에) 들어가다", "vi": "Trúng tuyển / Vào trường"},
  {"ko": "이유", "vi": "Lý do"},
  {"ko": "평일", "vi": "Ngày trong tuần"},
  {"ko": "사 오다", "vi": "Mua về"},
  {"ko": "초대를 받다", "vi": "Được mời"},
  {"ko": "코미디 영화", "vi": "Phim hài"},
  {"ko": "액션 영화", "vi": "Phim hành động"},
  {"ko": "소설책", "vi": "Sách tiểu thuyết"},
  {"ko": "시간이 나다", "vi": "Rảnh rỗi / Có thời gian"},
  {"ko": "스페인어", "vi": "Tiếng Tây Ban Nha"},
  {"ko": "언어", "vi": "Ngôn ngữ"},
  {"ko": "문화", "vi": "Văn hóa"},
  {"ko": "관심", "vi": "Hứng thú / Quan tâm"},
  {"ko": "중남미", "vi": "Trung Nam Mỹ"},
  {"ko": "정도", "vi": "Mức độ / Khoảng"},
  {"ko": "유명하다", "vi": "Nổi tiếng"},
  {"ko": "~에 대해(서)", "vi": "Về (vấn đề / chủ đề)"},
  {"ko": "발표하다", "vi": "Phát biểu / Trình bày"},
  {"ko": "글자", "vi": "Chữ cái / Ký tự"},
  {"ko": "제일", "vi": "Nhất"},
  {"ko": "친하다", "vi": "Thân thiết"},
  {"ko": "성", "vi": "Họ (trong họ tên)"},
  {"ko": "빼다", "vi": "Trừ ra / Bỏ ra"},
  {"ko": "형제들", "vi": "Anh em"},
  {"ko": "비슷하다", "vi": "Giống nhau / Tương tự"},

  // W【1과】 (11 từ mới bổ sung)
  {"ko": "교회", "vi": "Nhà thờ"},
  {"ko": "언제나", "vi": "Lúc nào cũng"},
  {"ko": "물어보다", "vi": "Hỏi"},
  {"ko": "빌리다", "vi": "Mượn, vay"},
  {"ko": "가져오다", "vi": "Mang theo"},
  {"ko": "켜다", "vi": "Bật"},
  {"ko": "모르다", "vi": "Không biết"},
  {"ko": "줄을 서다", "vi": "Xếp hàng"},
  {"ko": "수첩", "vi": "Sổ tay"},
  {"ko": "뛰어가다", "vi": "Chạy tới"},
  {"ko": "잊어버리다", "vi": "Quên mất"}
];

var pool = [];
var current = 0;
var points = 0;
var answered = false;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function start() {
  var n = parseInt(document.getElementById("amount").value, 10);
  pool = shuffle(WORDS).slice(0, n);
  current = 0;
  points = 0;
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("result").classList.add("hidden");
  load();
}

function load() {
  answered = false;
  var item = pool[current];
  var mode = document.getElementById("mode").value;
  var prompt = (mode === "ko") ? item.ko : item.vi;
  var correct = (mode === "ko") ? item.vi : item.ko;

  document.getElementById("counter").textContent = "Câu " + (current + 1) + "/" + pool.length;
  document.getElementById("score").textContent = "Điểm: " + points;
  document.getElementById("bar").style.width = (current / pool.length * 100) + "%";
  document.getElementById("question").textContent = prompt;
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").classList.add("hidden");

  var others = shuffle(WORDS.filter(function(w) { return w.ko !== item.ko; })).slice(0, 3);
  var choices = [correct];
  for (var i = 0; i < others.length; i++) {
    choices.push(mode === "ko" ? others[i].vi : others[i].ko);
  }
  choices = shuffle(choices);

  var box = document.getElementById("answers");
  box.innerHTML = "";
  for (var k = 0; k < choices.length; k++) {
    (function(choice) {
      var b = document.createElement("button");
      b.className = "answer";
      b.textContent = String.fromCharCode(65 + box.children.length) + ". " + choice;
      b.onclick = function() { choose(choice, correct, b); };
      box.appendChild(b);
    })(choices[k]);
  }
}

function choose(choice, correct, button) {
  if (answered) return;
  answered = true;
  var all = document.querySelectorAll(".answer");
  for (var i = 0; i < all.length; i++) all[i].disabled = true;

  if (choice === correct) {
    points++;
    button.classList.add("correct");
    document.getElementById("feedback").textContent = "✅ Chính xác!";
    document.getElementById("feedback").style.color = "#15803d";
  } else {
    button.classList.add("wrong");
    for (var j = 0; j < all.length; j++) {
      if (all[j].textContent.slice(3) === correct) all[j].classList.add("correct");
    }
    document.getElementById("feedback").textContent = "❌ Sai rồi! Đáp án đúng: " + correct;
    document.getElementById("feedback").style.color = "#b91c1c";
  }
  document.getElementById("score").textContent = "Điểm: " + points;
  document.getElementById("next").classList.remove("hidden");
}

function nextQuestion() {
  current++;
  if (current < pool.length) load();
  else finish();
}

function finish() {
  var pct = Math.round(points / pool.length * 100);
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("final").textContent = points + "/" + pool.length + " (" + pct + "%)";
  document.getElementById("message").textContent =
    pct >= 90 ? "🔥 Xuất sắc! Bạn đã nắm rất vững từ vựng Bài 1." :
    pct >= 70 ? "👏 Rất tốt! Luyện tập thêm một chút để đạt điểm tuyệt đối nhé." :
    pct >= 50 ? "💪 Khá ổn! Ôn lại các từ chưa nhớ kỹ nhé." :
    "📚 Cố lên! Hãy ôn tập lại danh sách từ vựng và thử lại nhé.";
}

document.getElementById("next").onclick = nextQuestion;
document.getElementById("restart").onclick = start;
document.getElementById("amount").onchange = start;
document.getElementById("mode").onchange = start;

start();
</script>
</body>
</html>
